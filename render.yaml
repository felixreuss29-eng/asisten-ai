services:
  - type: web
    name: asisten-ai-felix
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3.5-lightning:free
      - key: LLM_API_KEY
        sync: false
      - key: RATE_LIMIT
        value: 30
      - key: SEARCH_ENGINE
        value: ddg
